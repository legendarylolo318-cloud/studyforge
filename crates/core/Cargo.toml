[package]
name = "studyforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
directories = "6.0.0"
gethostname = "1.1.0"
pulldown-cmark = "0.13.6"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled", "chrono"] }
rusqlite_migration = "2.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
zip = "9.8.2"
zstd = "0.14.5"

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.27.0"
