[package]
name = "studyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "studyd_lib"
path = "src/lib.rs"

[[bin]]
name = "studyd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
interprocess = "2.4.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
studyforge-blocker = { version = "0.1.0", path = "../blocker" }
studyforge-core = { version = "0.1.0", path = "../core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
widestring = "1.2.1"
windows-service = "0.8.1"

[dev-dependencies]
chrono-tz = "0.10.4"
libc = "0.2.191"
tempfile = "3.27.0"
