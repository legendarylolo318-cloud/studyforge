name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04   # old glibc => runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libasound2-dev libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxdo-dev curl file
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p studyforge -p studyd
      - run: sh packaging/appimage/build.sh
      - name: Linux bundle (helper + install scripts)
        run: |
          mkdir -p dist/studyforge-linux
          cp target/release/studyforge target/release/studyd packaging/linux/* dist/studyforge-linux/
          tar -C dist -czf dist/studyforge-linux-x86_64.tar.gz studyforge-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/StudyForge-x86_64.AppImage
            dist/studyforge-linux-x86_64.tar.gz

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p studyforge -p studyd
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/StudyForge | Out-Null
          Copy-Item target/release/studyforge.exe, target/release/studyd.exe, README.md, LICENSE dist/StudyForge/
          Compress-Archive -Path dist/StudyForge -DestinationPath dist/StudyForge-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/StudyForge-windows-x86_64.zip
            target/release/studyforge.exe
            target/release/studyd.exe

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*
            artifacts/windows/StudyForge-windows-x86_64.zip
            artifacts/windows/target/release/studyforge.exe
            artifacts/windows/target/release/studyd.exe
