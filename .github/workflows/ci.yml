name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  check:
    name: build, test, clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Building the whole workspace on windows-latest type-checks every
      # cfg(windows) path: the service, registry policies, named pipe + ACL, tray.
      - name: build
        run: cargo build --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  release-binaries:
    name: release build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            libasound2-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p studyforge -p studyd
      - uses: actions/upload-artifact@v4
        with:
          name: studyforge-${{ runner.os }}
          path: |
            target/release/studyforge
            target/release/studyforge.exe
            target/release/studyd
            target/release/studyd.exe
            packaging/linux/**
          if-no-files-found: ignore
