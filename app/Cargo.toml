[package]
name = "studyforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
auto-launch = "0.6.0"
chrono = "0.4.45"
global-hotkey = "0.10.0"
interprocess = "2.4.9"
muda = "0.21.2"
notify-rust = "4.19.0"
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.19.1"
studyforge-core = { version = "0.1.0", path = "../crates/core" }
sysinfo = "0.40.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"

[build-dependencies]
slint-build = "1.19.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.3", features = ["global_shortcuts"] }
futures-util = "0.3.34"
gtk = "0.18"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
zbus = "6.5.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
png = "0.18.1"
slint = { version = "1.19.1", features = ["renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
tempfile = "3.27.0"
